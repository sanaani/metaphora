name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c
          mkdir -p "$HOME/metaphora-data/tools"
          tar -xzf "$f" -C "$HOME/metaphora-data/tools" gitleaks
      - name: Leak check, every tracked file and all history
        env:
          DENYLIST: ${{ secrets.METAPHORA_DENYLIST }}
        run: |
          [ -n "$DENYLIST" ] || { echo "METAPHORA_DENYLIST secret is not set"; exit 1; }
          export METAPHORA_DENYLIST="$RUNNER_TEMP/denylist.txt"
          printf '%s\n' "$DENYLIST" > "$METAPHORA_DENYLIST"
          scripts/check-leaks.sh tree
          scripts/check-leaks.sh history

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: scripts/lint.sh # the same command the local git hooks run
      - run: python -m pytest
